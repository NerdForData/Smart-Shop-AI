version: '3.8'

services:
  smartshop-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshop-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_DIR=/app/chroma_db
      - PYTHONPATH=/app
    volumes:
      - chroma_data:/app/chroma_db
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: smartshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  chroma_data:
  redis_data:
