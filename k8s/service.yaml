# k8s/service.yaml

# Main API Service — exposes to internet
apiVersion: v1
kind: Service
metadata:
  name: smartshop-service
  namespace: smartshop
  labels:
    app: smartshop-ai
spec:
  selector:
    app: smartshop-ai
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer

---
# Redis Service — internal only
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: smartshop
spec:
  selector:
    app: smartshop-redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP