# docker-compose.test.yml

version: '3.8'

services:
  smartshop-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshop-test
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PROJECT_ID=${PROJECT_ID}
      - BQ_DATASET=${BQ_DATASET}
      - BQ_LOCATION=${BQ_LOCATION}
      - CHROMA_DIR=/app/chroma_db
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    command: >
      sh -c "
        echo 'Running BigQuery connector tests...' &&
        python -m rag.bigquery_connector &&
        echo 'Running guardrails tests...' &&
        python -m guardrails.guardrails_manager &&
        echo 'Running orchestrator tests...' &&
        python -m orchestrator.graph &&
        echo 'All tests passed!'
      "